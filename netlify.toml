[build]
  command = "node --version"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/generate-blueprint"
  to = "/.netlify/functions/generate-blueprint"
  status = 200

[[redirects]]
  from = "/api/blueprint/start"
  to = "/.netlify/functions/blueprint-start"
  status = 200

[[redirects]]
  from = "/api/blueprint/:jobId"
  to = "/.netlify/functions/blueprint-status/:jobId"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
